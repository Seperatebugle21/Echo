name: Build Echo IPA (Unsigned)

on:
  workflow_dispatch:

  push:
    branches:
      - Widget

  pull_request:
    branches:
      - Widget


jobs:

  build:

    runs-on: macos-latest

    permissions:
      contents: write


    steps:

      # ============================================
      # 1. Checkout
      # ============================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================
      # 2. Generate Xcode project and resolve packages
      # ============================================

      - name: Generate project and resolve dependencies
        run: |

          # CPython 3.13 for iOS (BeeWare), needed by yt-dlp.
          Scripts/fetch-python.sh

          brew install xcodegen
          xcodegen generate --spec project.yml
          mkdir -p build

          xcodebuild \
            -resolvePackageDependencies \
            -project Echo.xcodeproj \
            -scheme Echo \
            -derivedDataPath build/DerivedData


     

      # ============================================
      # 4. Build
      # ============================================

      - name: Build Echo with widgets
        run: |

          mkdir -p build

          echo ""
          echo "========================================"
          echo " BUILDING ECHO"
          echo "========================================"
          echo ""

          xcodebuild archive \
            -project Echo.xcodeproj \
            -scheme Echo \
            -destination 'generic/platform=iOS' \
            -archivePath build/Echo.xcarchive \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEAD_CODE_STRIPPING=NO \
            COPY_PHASE_STRIP=NO \
            STRIP_INSTALLED_PRODUCT=NO


      # ============================================
      # 5. Verify Python runtime
      # ============================================

      - name: Verify embedded Python runtime
        run: |

          APP_PATH=$(find build/Echo.xcarchive/Products/Applications \
            -maxdepth 1 \
            -name "*.app" \
            | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Echo.app niet gevonden."
            exit 1
          fi

          APP_PATH=$(realpath "$APP_PATH")

          WIDGET_PATH=$(find "$APP_PATH/PlugIns" \
            -maxdepth 1 \
            -name "EchoWidget.appex" \
            | head -n 1)

          if [ -z "$WIDGET_PATH" ]; then
            echo "ERROR: EchoWidget.appex ontbreekt."
            exit 1
          fi

          echo "Widget extension:"
          echo "$WIDGET_PATH"

          INFO_PLIST="$APP_PATH/Info.plist"

          EXECUTABLE_NAME=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleExecutable" \
              "$INFO_PLIST"
          )

          EXECUTABLE="$APP_PATH/$EXECUTABLE_NAME"


          if [ ! -f "$EXECUTABLE" ]; then
            echo "ERROR: executable niet gevonden."
            exit 1
          fi


          # ============================================
          # Python 3.13 runtime (BeeWare Python.xcframework)
          # ============================================

          PYTHON_FRAMEWORK="$APP_PATH/Frameworks/Python.framework/Python"

          if [ ! -f "$PYTHON_FRAMEWORK" ]; then
            echo "ERROR: Python.framework ontbreekt in Frameworks."
            ls "$APP_PATH/Frameworks" || true
            exit 1
          fi

          if ! otool -L "$EXECUTABLE" | grep -q "Python.framework/Python"; then
            echo "ERROR: Echo linkt niet tegen Python.framework."
            otool -L "$EXECUTABLE"
            exit 1
          fi

          echo "Python.framework:"
          lipo -info "$PYTHON_FRAMEWORK"


          # ============================================
          # Python stdlib + binary modules
          # ============================================

          STDLIB="$APP_PATH/python/lib/python3.13"

          for FILE in os.py encodings/__init__.py ssl.py; do
            if [ ! -f "$STDLIB/$FILE" ]; then
              echo "ERROR: Python stdlib ontbreekt: $STDLIB/$FILE"
              exit 1
            fi
          done

          FWORK_COUNT=$(find "$STDLIB/lib-dynload" -name "*.fwork" | wc -l | tr -d ' ')
          SO_COUNT=$(find "$APP_PATH/python" -name "*.so" | wc -l | tr -d ' ')

          echo "Binary modules (.fwork): $FWORK_COUNT"

          if [ "$FWORK_COUNT" -lt 50 ] || [ "$SO_COUNT" -ne 0 ]; then
            echo "ERROR: binaire Python-modules niet correct omgezet ($FWORK_COUNT .fwork, $SO_COUNT .so)."
            exit 1
          fi

          for MODULE in _ssl _hashlib _sqlite3 _ctypes zlib; do
            if [ ! -f "$APP_PATH/Frameworks/$MODULE.framework/$MODULE" ]; then
              echo "ERROR: module-framework ontbreekt: $MODULE"
              ls "$APP_PATH/Frameworks"
              exit 1
            fi
          done


          # ============================================
          # Symbols
          # ============================================

          check_symbol() {

            SYMBOL="$1"

            if xcrun nm -gU "$PYTHON_FRAMEWORK" \
              | grep -q " $SYMBOL$"; then

              echo "OK: $SYMBOL"

            else

              echo "MISSING: $SYMBOL"
              exit 1
            fi
          }


          check_symbol "_Py_InitializeEx"
          check_symbol "_Py_IsInitialized"
          check_symbol "_PyGILState_Ensure"
          check_symbol "_PyEval_SaveThread"
          check_symbol "_PyRun_SimpleString"
          check_symbol "_PyUnicode_FromString"
          check_symbol "_Py_DecRef"


          echo ""
          echo "========================================"
          echo " PYTHON 3.13 RUNTIME OK"
          echo "========================================"


      # ============================================
      # 6. Create IPA
      # ============================================

      - name: Create IPA Package
        run: |

          rm -rf Payload
          mkdir -p Payload


          BUILT_APP=$(find build/Echo.xcarchive/Products/Applications \
            -maxdepth 1 \
            -name "*.app" \
            | head -n 1)


          if [ -z "$BUILT_APP" ]; then
            echo "Geen gebouwde Echo.app gevonden."
            exit 1
          fi


          cp -R "$BUILT_APP" Payload/


          APP_PATH=$(find Payload \
            -maxdepth 1 \
            -name "*.app" \
            | head -n 1)


          if [ -z "$APP_PATH" ]; then
            echo "App niet gevonden in Payload."
            exit 1
          fi


          INFO_PLIST="$APP_PATH/Info.plist"


          if [ ! -f "$INFO_PLIST" ]; then
            echo "Info.plist niet gevonden."
            exit 1
          fi


          # ============================================
          # Background audio
          # ============================================

          /usr/libexec/PlistBuddy \
            -c "Delete :UIBackgroundModes" \
            "$INFO_PLIST" \
            2>/dev/null || true


          /usr/libexec/PlistBuddy \
            -c "Add :UIBackgroundModes array" \
            "$INFO_PLIST"


          /usr/libexec/PlistBuddy \
            -c "Add :UIBackgroundModes:0 string audio" \
            "$INFO_PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :UIBackgroundModes:1 string fetch" \
            "$INFO_PLIST"

          /usr/libexec/PlistBuddy -c "Delete :BGTaskSchedulerPermittedIdentifiers" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :BGTaskSchedulerPermittedIdentifiers array" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Add :BGTaskSchedulerPermittedIdentifiers:0 string com.echomusic.app.podcast-refresh" "$INFO_PLIST"


          # ============================================
          # Files access
          # ============================================

          /usr/libexec/PlistBuddy \
            -c "Add :UIFileSharingEnabled bool true" \
            "$INFO_PLIST" \
            2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Set :UIFileSharingEnabled true" \
            "$INFO_PLIST"


          /usr/libexec/PlistBuddy \
            -c "Add :LSSupportsOpeningDocumentsInPlace bool true" \
            "$INFO_PLIST" \
            2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Set :LSSupportsOpeningDocumentsInPlace true" \
            "$INFO_PLIST"


          # ============================================
          # Spotify callback
          # ============================================

          /usr/libexec/PlistBuddy \
            -c "Delete :CFBundleURLTypes" \
            "$INFO_PLIST" \
            2>/dev/null || true


          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleURLTypes array" \
            "$INFO_PLIST"


          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleURLTypes:0 dict" \
            "$INFO_PLIST"


          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleURLTypes:0:CFBundleURLName string echo.spotify.login" \
            "$INFO_PLIST"


          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" \
            "$INFO_PLIST"


          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string echo-spotify-login" \
            "$INFO_PLIST"


          # ============================================
          # Siri / SiriKit
          # ============================================

          echo ""
          echo "========================================"
          echo " CONFIGURING SIRI"
          echo "========================================"
          echo ""


          /usr/libexec/PlistBuddy \
            -c "Delete :INIntentsSupported" \
            "$INFO_PLIST" \
            2>/dev/null || true


          /usr/libexec/PlistBuddy \
            -c "Add :INIntentsSupported array" \
            "$INFO_PLIST"


          /usr/libexec/PlistBuddy \
            -c "Add :INIntentsSupported:0 string INPlayMediaIntent" \
            "$INFO_PLIST"


          # ============================================
          # Music media category
          # ============================================

          /usr/libexec/PlistBuddy \
            -c "Delete :INSupportedMediaCategories" \
            "$INFO_PLIST" \
            2>/dev/null || true


          /usr/libexec/PlistBuddy \
            -c "Add :INSupportedMediaCategories array" \
            "$INFO_PLIST"


          /usr/libexec/PlistBuddy \
            -c "Add :INSupportedMediaCategories:0 string INMediaCategoryMusic" \
            "$INFO_PLIST"


          # ============================================
          # Siri usage description
          # ============================================

          /usr/libexec/PlistBuddy \
            -c "Delete :NSSiriUsageDescription" \
            "$INFO_PLIST" \
            2>/dev/null || true


          /usr/libexec/PlistBuddy \
            -c "Add :NSSiriUsageDescription string Echo gebruikt Siri om muziek en playlists af te spelen." \
            "$INFO_PLIST"


          # ============================================
          # Verify Siri configuration
          # ============================================

          echo ""
          echo "========================================"
          echo " SIRI CONFIGURATION"
          echo "========================================"


          echo ""
          echo "Supported intents:"

          /usr/libexec/PlistBuddy \
            -c "Print :INIntentsSupported" \
            "$INFO_PLIST"


          echo ""
          echo "Supported media categories:"

          /usr/libexec/PlistBuddy \
            -c "Print :INSupportedMediaCategories" \
            "$INFO_PLIST"


          echo ""
          echo "Siri usage description:"

          /usr/libexec/PlistBuddy \
            -c "Print :NSSiriUsageDescription" \
            "$INFO_PLIST"


          # ============================================
          # Final Info.plist
          # ============================================

          echo ""
          echo "========================================"
          echo " FINAL INFO.PLIST"
          echo "========================================"
          echo ""


          /usr/libexec/PlistBuddy \
            -c "Print" \
            "$INFO_PLIST"


          # ============================================
          # Python files
          # ============================================

          echo ""
          echo "========================================"
          echo " PYTHON FILES"
          echo "========================================"


          find "$APP_PATH" \
            \( \
              -iname "*python*" \
              -o \
              -name "*.bundle" \
            \) \
            -print || true


          # ============================================
          # Create IPA
          # ============================================

          # Preserve the Echo launcher as well as the Spotify callback.
          python3 - "$INFO_PLIST" <<'PY'
          import plistlib
          import sys
          from pathlib import Path
          info = plistlib.loads(Path(sys.argv[1]).read_bytes())
          assert {"audio", "fetch"}.issubset(info.get("UIBackgroundModes", [])), "Missing background audio/fetch"
          assert "com.echomusic.app.podcast-refresh" in info.get("BGTaskSchedulerPermittedIdentifiers", []), "Missing podcast refresh identifier"
          PY

          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1 dict" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1:CFBundleURLName string echo.widgets" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1:CFBundleURLSchemes array" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:1:CFBundleURLSchemes:0 string echo" "$INFO_PLIST"

          # A CODE_SIGNING_ALLOWED=NO archive does not embed requested entitlements.
          # Add ad-hoc signatures so SideStore can discover and provision the
          # shared App Group. SideStore replaces these signatures at installation.
          # Embed entitlements in the Mach-O files only. SideStore later signs
          # the complete bundles/frameworks with the user's provisioning profiles.
          WIDGET_BUNDLE="$APP_PATH/PlugIns/EchoWidget.appex"
          APP_EXECUTABLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$INFO_PLIST")
          WIDGET_EXECUTABLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$WIDGET_BUNDLE/Info.plist")
          codesign --force --sign - --identifier com.echomusic.app.widget \
            --entitlements Configuration/EchoWidget.entitlements "$WIDGET_BUNDLE/$WIDGET_EXECUTABLE"
          codesign --force --sign - --identifier com.echomusic.app \
            --entitlements Configuration/Echo.entitlements "$APP_PATH/$APP_EXECUTABLE"

          codesign -d --entitlements :- "$APP_PATH/$APP_EXECUTABLE" > build/app-entitlements.plist
          codesign -d --entitlements :- "$WIDGET_BUNDLE/$WIDGET_EXECUTABLE" > build/widget-entitlements.plist
          python3 -c 'import plistlib; from pathlib import Path; expected=["group.com.echomusic.app"]; paths=[Path("build/app-entitlements.plist"), Path("build/widget-entitlements.plist")]; groups=[plistlib.loads(p.read_bytes()).get("com.apple.security.application-groups") for p in paths]; assert all(g == expected for g in groups), groups'

          rm -f Echo.ipa

          zip -r Echo.ipa Payload


      # ============================================
      # 7. Upload IPA
      # ============================================

      - name: Save IPA to Artifacts
        uses: actions/upload-artifact@v4

        with:
          name: Echo-Release-IPA
          path: Echo.ipa
