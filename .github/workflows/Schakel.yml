name: Schakel (word game)

on:
  workflow_dispatch:
  push:
    paths:
      - "WordChain/**"
      - ".github/workflows/Schakel.yml"
  pull_request:
    paths:
      - "WordChain/**"
      - ".github/workflows/Schakel.yml"

concurrency:
  group: schakel-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: WordChain

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check word lists
        run: python3 Scripts/check_words.py

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml
          xcodebuild -version

      - name: Pick an iPhone simulator
        id: sim
        run: |
          SIM_ID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          best = None
          for runtime, devices in data.items():
              if "iOS" not in runtime:
                  continue
              version = tuple(int(p) for p in runtime.rsplit(".", 1)[-1].split("-")[1:] if p.isdigit())
              for d in devices:
                  if d["name"].startswith("iPhone"):
                      key = (version, d["name"])
                      if best is None or key > best[0]:
                          best = (key, d["udid"], runtime, d["name"])
          if best is None:
              sys.exit("No iPhone simulator available")
          print(best[1])
          print(best[2], best[3], file=sys.stderr)
          ')
          echo "id=$SIM_ID" >> "$GITHUB_OUTPUT"

      - name: Build and run tests
        run: |
          mkdir -p build
          set +e
          xcodebuild test \
            -project Schakel.xcodeproj \
            -scheme Schakel \
            -destination "id=${{ steps.sim.outputs.id }}" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/Tests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            > build/test.log 2>&1
          STATUS=$?
          set -e
          grep -E "error:|warning: .*Schakel|Test Case .*(passed|failed)|Executed|\*\* TEST" build/test.log || tail -n 120 build/test.log
          exit $STATUS

      - name: Build unsigned IPA
        run: |
          xcodebuild archive \
            -project Schakel.xcodeproj \
            -scheme Schakel \
            -destination 'generic/platform=iOS' \
            -archivePath build/Schakel.xcarchive \
            -derivedDataPath build/DerivedDataDevice \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            > build/archive.log 2>&1 || { grep -E "error:" build/archive.log || tail -n 80 build/archive.log; exit 1; }
          mkdir -p build/Payload
          cp -R build/Schakel.xcarchive/Products/Applications/Schakel.app build/Payload/
          (cd build && zip -qry Schakel.ipa Payload)
          ls -lh build/Schakel.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Schakel-ipa
          path: WordChain/build/Schakel.ipa

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Schakel-logs
          path: |
            WordChain/build/*.log
            WordChain/build/Tests.xcresult
          if-no-files-found: ignore
