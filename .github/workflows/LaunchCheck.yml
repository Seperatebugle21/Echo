name: Launch check

on:
  push:
    branches: [claude/animations-visual-flow-w18b1p]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build app for an iPhone simulator
        run: |
          Scripts/fetch-python.sh
          brew install xcodegen
          xcodegen generate --spec project.yml
          SIMULATOR_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); ids=[x["udid"] for r,entries in d["devices"].items() if "iOS-" in r and int(r.split("iOS-")[-1].split("-")[0]) >= 26 for x in entries if x.get("isAvailable") and "iPhone" in x["name"]]; assert ids; print(ids[0])')
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcodebuild build -project Echo.xcodeproj -scheme Echo -configuration Release \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/Launch CODE_SIGNING_ALLOWED=NO | tail -n 40
      - name: Launch and report crashes
        run: |
          APP=$(ls -d build/Launch/Build/Products/Release-iphonesimulator/Echo.app)
          xcrun simctl install "$SIMULATOR_ID" "$APP"
          CONTAINER=$(xcrun simctl get_app_container "$SIMULATOR_ID" com.echomusic.app data)
          python3 .github/scripts/seed-home-preview.py "$CONTAINER" || true
          mkdir -p build/LaunchShots
          STATUS=0
          for RUN in onboarded fresh; do
            xcrun simctl terminate "$SIMULATOR_ID" com.echomusic.app || true
            if [ "$RUN" = onboarded ]; then ARGS="-hasCompletedEchoOnboarding YES"; else ARGS=""; fi
            xcrun simctl launch --console-pty "$SIMULATOR_ID" com.echomusic.app $ARGS > "build/LaunchShots/console-$RUN.txt" 2>&1 &
            sleep 12
            xcrun simctl io "$SIMULATOR_ID" screenshot "build/LaunchShots/$RUN.png" || true
            if xcrun simctl spawn "$SIMULATOR_ID" launchctl list | grep -q com.echomusic.app; then
              echo "== $RUN: Echo is running"
            else
              echo "== $RUN: Echo is NOT running"; STATUS=1
            fi
            echo "---- console ($RUN)"; tail -n 80 "build/LaunchShots/console-$RUN.txt" || true
          done
          echo "---- crash reports"
          for F in ~/Library/Logs/DiagnosticReports/Echo*.ips ~/Library/Logs/DiagnosticReports/*/Echo*.ips; do
            [ -f "$F" ] || continue
            echo "==== $F"; head -c 30000 "$F"; cp "$F" build/LaunchShots/ || true
          done
          echo "---- system log"
          xcrun simctl spawn "$SIMULATOR_ID" log show --last 3m --style compact \
            --predicate 'process == "Echo" AND (messageType == error OR messageType == fault OR eventMessage CONTAINS[c] "fatal" OR eventMessage CONTAINS[c] "crash")' | tail -n 150 || true
          exit $STATUS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Echo-Launch-Check
          path: build/LaunchShots
