name: Python runtime test (simulator)

# Builds Echo for an iPhone simulator, launches it with -EchoPythonSelfTest
# and checks that the embedded CPython 3.13 starts, its standard library
# modules load and yt-dlp can be downloaded and imported.

on:
  workflow_dispatch:

  push:
    branches:
      - Widget
      - claude/yt-dlp-python-version-9t8xg4

permissions:
  contents: read

concurrency:
  group: python-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-test:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Fetch Python and generate project
        run: |
          Scripts/fetch-python.sh
          brew install xcodegen
          xcodegen generate --spec project.yml

      - name: Boot simulator
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); ids=[x["udid"] for r,entries in d["devices"].items() if "iOS-" in r and int(r.split("iOS-")[-1].split("-")[0]) >= 26 for x in entries if x.get("isAvailable") and "iPhone" in x["name"]]; assert ids; print(ids[0])')
          echo "SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild build -project Echo.xcodeproj -scheme Echo -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/Sim CODE_SIGNING_ALLOWED=NO \
            | tee build/xcodebuild.log | grep -E "error:|warning: .*Python|Install Python|BUILD" || true
          test -d build/Sim/Build/Products/Debug-iphonesimulator/Echo.app

      - name: Check app bundle
        run: |
          APP=build/Sim/Build/Products/Debug-iphonesimulator/Echo.app
          ls "$APP/Frameworks" | head -100
          test -f "$APP/Frameworks/Python.framework/Python"
          test -f "$APP/python/lib/python3.13/os.py"
          echo "fwork files: $(find "$APP/python" -name '*.fwork' | wc -l)"

      - name: Run Python self-test
        run: |
          APP=build/Sim/Build/Products/Debug-iphonesimulator/Echo.app
          xcrun simctl install "$SIMULATOR_ID" "$APP"
          CONTAINER=$(xcrun simctl get_app_container "$SIMULATOR_ID" com.echomusic.app data)
          REPORT="$CONTAINER/Documents/python-self-test.json"
          rm -f "$REPORT"

          # Keep the simulator log for diagnosis.
          xcrun simctl spawn "$SIMULATOR_ID" log stream --level debug \
            --predicate 'process == "Echo"' > build/echo.log 2>&1 &
          LOG_PID=$!

          xcrun simctl launch "$SIMULATOR_ID" com.echomusic.app \
            -EchoPythonSelfTest -hasCompletedEchoOnboarding YES

          STATUS=""
          for i in $(seq 1 120); do
            sleep 3
            if [ -f "$REPORT" ]; then
              STATUS=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status",""))' "$REPORT" || true)
              if [ "$STATUS" = "passed" ] || [ "$STATUS" = "failed" ]; then
                break
              fi
            fi
            if ! xcrun simctl spawn "$SIMULATOR_ID" launchctl list | grep -q com.echomusic.app; then
              echo "Echo is not running any more (crash?)"
              break
            fi
          done

          kill $LOG_PID || true
          mkdir -p build/report
          cp "$REPORT" build/report/ 2>/dev/null || true
          cp -R ~/Library/Logs/DiagnosticReports build/report/ 2>/dev/null || true

          echo "================ SELF-TEST REPORT ================"
          cat "$REPORT" 2>/dev/null || echo "(no report written)"
          echo "=================================================="

          if [ "$STATUS" != "passed" ]; then
            echo "---- last Echo log lines ----"
            tail -200 build/echo.log || true
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Python-Runtime-Test
          path: |
            build/report
            build/echo.log
            build/xcodebuild.log
