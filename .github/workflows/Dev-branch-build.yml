name: Build Echo IPA (Unsigned)

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master
      - Add-spotify-downloader


jobs:
  build:

    runs-on: macos-latest

    permissions:
      contents: write


    steps:

      # ============================================
      # 1. Repository ophalen
      # ============================================

      - name: Checkout repository
        uses: actions/checkout@v4


        


      # ============================================
      # 2. SwiftLAME dependency injecteren
      # ============================================

      - name: Add SwiftLAME dependency
        run: |
          PACKAGE_FILE=$(find . -name "Package.swift" | head -n 1)

          echo "Package.swift gevonden op:"
          echo "$PACKAGE_FILE"

          if [ -z "$PACKAGE_FILE" ]; then
            echo "Geen Package.swift gevonden."
            exit 1
          fi

          python3 <<'PY'
          from pathlib import Path
          import re

          package = next(Path(".").rglob("Package.swift"))
          text = package.read_text()

          print("Package:", package)

          # ============================================
          # Package dependency toevoegen
          # ============================================

          if "hidden-spectrum/swiftlame" not in text.lower():

              # Voeg dependencies toe vóór targets:
              marker = "\n    targets: ["

              if marker not in text:
                  raise SystemExit(
                      "Kon 'targets: [' niet vinden in Package.swift"
                  )

              dependency_block = """
    dependencies: [
        .package(
            url: "https://github.com/hidden-spectrum/swiftlame",
            .upToNextMajor(from: "0.1.0")
        )
    ],
"""

              text = text.replace(
                  marker,
                  "\n" + dependency_block + "    targets: [",
                  1
              )


          # ============================================
          # SwiftLAME aan AppModule target koppelen
          # ============================================

          if '.product(name: "SwiftLAME"' not in text:

              pattern = r'(\.executableTarget\(\s*name:\s*"AppModule",)'

              replacement = r'''\1
            dependencies: [
                .product(
                    name: "SwiftLAME",
                    package: "swiftlame"
                )
            ],'''

              new_text, count = re.subn(
                  pattern,
                  replacement,
                  text,
                  count=1
              )

              if count == 0:
                  raise SystemExit(
                      "Kon executableTarget AppModule niet vinden."
                  )

              text = new_text


          package.write_text(text)

          print("")
          print("================================")
          print(" PATCHED PACKAGE.SWIFT")
          print("================================")
          print("")
          print(text)
          PY


      # ============================================
      # 3. SwiftPM project bouwen
      # ============================================

      - name: Build SwiftPM
        run: |

          PACKAGE_DIR=$(find . -name "Package.swift" -exec dirname {} \; | head -n 1)

          echo "Gevonden Package map: $PACKAGE_DIR"

          if [ -z "$PACKAGE_DIR" ]; then
            echo "Geen Package.swift gevonden."
            exit 1
          fi

          cd "$PACKAGE_DIR"

          mkdir -p ../build

          xcodebuild archive \
            -scheme Echo \
            -destination 'generic/platform=iOS' \
            -archivePath ../build/Echo.xcarchive \
            -derivedDataPath ../build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""


      # ============================================
      # 4. IPA maken + Info.plist aanpassen
      # ============================================

      - name: Create IPA Package
        run: |

          rm -rf Payload
          mkdir -p Payload

          BUILT_APP=$(find build/Echo.xcarchive/Products/Applications \
            -maxdepth 1 \
            -name "*.app" \
            | head -n 1)

          if [ -z "$BUILT_APP" ]; then
            BUILT_APP=$(find build/Echo.xcarchive/Products/Applications \
              -maxdepth 1 \
              -name "*.swiftpm" \
              | head -n 1)
          fi

          echo "Gebouwde app gevonden op:"
          echo "$BUILT_APP"

          if [ -z "$BUILT_APP" ]; then
            echo "Geen gebouwde Echo app gevonden."
            exit 1
          fi

          cp -R "$BUILT_APP" Payload/

          APP_PATH=$(find Payload \
            -maxdepth 1 \
            \( -name "*.app" -o -name "*.swiftpm" \) \
            | head -n 1)

          echo "App in Payload:"
          echo "$APP_PATH"

          if [ -z "$APP_PATH" ]; then
            echo "App niet gevonden in Payload."
            exit 1
          fi

          INFO_PLIST="$APP_PATH/Info.plist"

          if [ ! -f "$INFO_PLIST" ]; then
            echo "Info.plist niet gevonden op:"
            echo "$INFO_PLIST"
            exit 1
          fi


          # ============================================
          # 4A. Background Audio
          # ============================================

          /usr/libexec/PlistBuddy \
            -c "Delete :UIBackgroundModes" \
            "$INFO_PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :UIBackgroundModes array" \
            "$INFO_PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :UIBackgroundModes:0 string audio" \
            "$INFO_PLIST"


          # ============================================
          # 4B. Files-app toegang
          # ============================================

          /usr/libexec/PlistBuddy \
            -c "Add :UIFileSharingEnabled bool true" \
            "$INFO_PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Set :UIFileSharingEnabled true" \
            "$INFO_PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :LSSupportsOpeningDocumentsInPlace bool true" \
            "$INFO_PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Set :LSSupportsOpeningDocumentsInPlace true" \
            "$INFO_PLIST"


          # ============================================
          # 4C. Spotify callback URL scheme
          # ============================================

          /usr/libexec/PlistBuddy \
            -c "Delete :CFBundleURLTypes" \
            "$INFO_PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleURLTypes array" \
            "$INFO_PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleURLTypes:0 dict" \
            "$INFO_PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleURLTypes:0:CFBundleURLName string echo.spotify.login" \
            "$INFO_PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" \
            "$INFO_PLIST"

          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string echo-spotify-login" \
            "$INFO_PLIST"


          # ============================================
          # 4D. Debug / controle
          # ============================================

          echo ""
          echo "================================"
          echo " FINAL INFO.PLIST"
          echo "================================"
          echo ""

          /usr/libexec/PlistBuddy \
            -c "Print" \
            "$INFO_PLIST"

          echo ""
          echo "================================"
          echo " URL TYPES"
          echo "================================"
          echo ""

          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleURLTypes" \
            "$INFO_PLIST"


          # ============================================
          # 4E. IPA maken
          # ============================================

          rm -f Echo.ipa

          zip -r Echo.ipa Payload


      # ============================================
      # 5. IPA als GitHub Artifact opslaan
      # ============================================

      - name: Save IPA to Artifacts
        uses: actions/upload-artifact@v4

        with:
          name: Echo-Release-IPA
          path: Echo.ipa


      # ============================================
      # 6. GitHub Release maken
      # ============================================

      - name: Create Github Release
        uses: ncipollo/release-action@v1

        with:
          artifacts: "Echo.ipa"
          tag: "v1.0.${{ github.run_number }}"
          token: ${{ secrets.GITHUB_TOKEN }}
