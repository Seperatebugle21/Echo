name: Build Echo App to IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # 1. Unzip project
    - name: Unzip Echo project
      run: |
        unzip Echo.swiftpm.zip -d project_dir

    # 2. Bouw het project
    - name: Build Swift Package
      run: |
        cd project_dir/*
        
        # Automatisch het eerste beschikbare scheme zoeken en bouwen
        SCHEME=$(xcodebuild -list -json | jq -r '.workspace.schemes[0] // .project.schemes[0]')
        echo "Gevonden scheme: $SCHEME"
        
        xcodebuild build \
          -scheme "$SCHEME" \
          -destination 'generic/platform=iOS' \
          -configuration Release \
          CODE_SIGNING_ALLOWED=NO \
          BUILD_DIR=../../build

    # 3. Maak de .ipa
    - name: Create .ipa Package
      run: |
        mkdir -p Payload
        # Zoek het gegenereerde .app bestand
        APP_PATH=$(find build/Release-iphoneos -name "*.app" | head -n 1)
        
        if [ -z "$APP_PATH" ]; then
          echo "FOUT: Geen .app bestand gevonden!"
          exit 1
        fi
        
        cp -r "$APP_PATH" Payload/
        zip -r Echo.ipa Payload

    # 4. Upload .ipa
    - name: Upload .ipa Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Echo-IPA
        path: Echo.ipa
