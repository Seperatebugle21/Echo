name: Build Echo App to IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # 1. Pak het zip-bestand uit
    - name: Unzip Echo project
      run: |
        unzip Echo.swiftpm.zip -d project_dir

    # 2. Bouw het Swift Package via xcodebuild
    - name: Build Swift PM App
      run: |
        cd project_dir/*
        xcodebuild build \
          -scheme Echo \
          -destination 'generic/platform=iOS' \
          -configuration Release \
          CODE_SIGNING_ALLOWED=NO \
          BUILD_DIR=../../build

    # 3. Verpak de .app naar een .ipa
    - name: Create .ipa Package
      run: |
        mkdir -p Payload
        cp -r build/Release-iphoneos/*.app Payload/
        zip -r Echo.ipa Payload

    # 4. Upload de .ipa als downloadbaar bestand
    - name: Upload .ipa Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Echo-IPA
        path: Echo.ipa
