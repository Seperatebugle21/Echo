name: Build and Release Echo IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      # 1. Haal de repository op van GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Pak de SwiftPM ZIP uit
      - name: Unzip Echo Project
        run: |
          unzip Echo.swiftpm.zip -d project_dir

      # 3. Installeer Apple Certificaat en Provisioning Profile uit Secrets
      - name: Install Apple certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPSTORE_CERT_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPSTORE_CERT_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.MOBILEPROVISION_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Decodeer de secrets naar bestanden
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode --output $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode --output $PP_PATH

          # Maak een tijdelijke Keychain aan op de virtuele mac
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Importeer het certificaat in de Keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Kopieer het provisioning profile naar de juiste map
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      # 4. Zoek de map met Package.swift en bouw de app via xcodebuild
      - name: Build SwiftPM as Xcode Archive
        run: |
          PACKAGE_DIR=$(find project_dir -name "Package.swift" -exec dirname {} \;)
          echo "Gevonden Package map: $PACKAGE_DIR"
          cd "$PACKAGE_DIR"

          xcodebuild archive \
            -scheme Echo \
            -destination 'generic/platform=iOS' \
            -archivePath ../../build/Echo.xcarchive \
            -derivedDataPath ../../build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # 5. Zet de gecompileerde .app om naar een .ipa bestand
      - name: Create IPA Package
        run: |
          mkdir -p Payload
          cp -r build/Echo.xcarchive/Products/Applications/*.app Payload/ 2>/dev/null || cp -r build/Echo.xcarchive/Products/Applications/*.swiftpm Payload/
          zip -r Echo.ipa Payload

      # 6. Sla het .ipa bestand op als GitHub Artifact
      - name: Save IPA to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Echo-Release-IPA
          path: Echo.ipa

      # 7. Maak automatisch een GitHub Release aan
      - name: Create Github Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "Echo.ipa"
          tag: "v1.0.${{ github.run_number }}"
          token: ${{ secrets.GITHUB_TOKEN }}

      # 8. Opruimen van gevoelige sleutels en certificaten
      - name: Clean up keychain and provisioning profile
        if: ${{ always() }}
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision
