name: Build Echo IPA (Unsigned)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      # 1. Haal de repository op
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Pak de SwiftPM ZIP uit
      - name: Unzip Echo Project
        run: |
          unzip Echo.swiftpm.zip -d project_dir

      # 3. Bouw de app via xcodebuild zonder code signing
      - name: Build SwiftPM
        run: |
          PACKAGE_DIR=$(find project_dir -name "Package.swift" -exec dirname {} \;)
          echo "Gevonden Package map: $PACKAGE_DIR"
          cd "$PACKAGE_DIR"

          xcodebuild archive \
            -scheme Echo \
            -destination 'generic/platform=iOS' \
            -archivePath ../../build/Echo.xcarchive \
            -derivedDataPath ../../build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # 4. Maak de IPA map
      - name: Create IPA Package
        run: |
          mkdir -p Payload
          cp -r build/Echo.xcarchive/Products/Applications/*.app Payload/ 2>/dev/null || cp -r build/Echo.xcarchive/Products/Applications/*.swiftpm Payload/
          zip -r Echo.ipa Payload

      # 5. Sla op als GitHub Artifact
      - name: Save IPA to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Echo-Release-IPA
          path: Echo.ipa

      # 6. Maak GitHub Release
      - name: Create Github Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "Echo.ipa"
          tag: "v1.0.${{ github.run_number }}"
          token: ${{ secrets.GITHUB_TOKEN }}
