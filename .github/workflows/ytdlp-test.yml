name: Echo YT-DLP Build Test

on:

  push:
    branches:
      - YT-DLP

  workflow_dispatch:


jobs:

  build:

    runs-on: macos-15

    steps:


      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # XCODE
      # =========================================================

      - name: Select Xcode
        run: |

          sudo xcode-select \
            -s /Applications/Xcode_16.4.app/Contents/Developer

          echo "===== XCODE ====="

          xcodebuild -version

          echo ""

          echo "===== SWIFT ====="

          swift --version


      # =========================================================
      # SHOW SOURCE STRUCTURE
      # =========================================================

      - name: Show Echo source structure
        run: |

          echo "===== ECHO.SWIFTPM ====="

          find Echo.swiftpm \
            -maxdepth 5 \
            -type f \
            | sort

          echo ""

          echo "===== SWIFT FILES ====="

          find Echo.swiftpm \
            -type f \
            -name "*.swift" \
            | sort


      # =========================================================
      # FIND APP ENTRYPOINT
      # =========================================================

      - name: Find @main
        run: |

          echo "===== SEARCHING FOR @main ====="

          grep \
            -R \
            -n \
            "@main" \
            Echo.swiftpm \
            --include="*.swift" \
            || true

          echo ""

          echo "===== SEARCHING FOR App PROTOCOL ====="

          grep \
            -R \
            -n \
            ": App" \
            Echo.swiftpm \
            --include="*.swift" \
            || true


      # =========================================================
      # INSTALL XCODEGEN
      # =========================================================

      - name: Install XcodeGen
        run: |

          brew install xcodegen

          echo ""

          xcodegen --version


      # =========================================================
      # GENERATE PROJECT
      # =========================================================

      - name: Generate Xcode project
        run: |

          xcodegen generate \
            --spec project.yml

          echo ""

          echo "===== GENERATED PROJECT ====="

          ls -la Echo.xcodeproj


      # =========================================================
      # CHECK SOURCES IN XCODE PROJECT
      # =========================================================

      - name: Check generated sources
        run: |

          echo "===== SWIFT FILES IN PBXPROJ ====="

          grep \
            -n \
            "\.swift" \
            Echo.xcodeproj/project.pbxproj \
            | head -300 \
            || true

          echo ""

          echo "===== SEARCH FOR @MAIN FILE ====="

          MAIN_FILE=$(grep \
            -R \
            -l \
            "@main" \
            Echo.swiftpm \
            --include="*.swift" \
            | head -1)

          echo "Main file: $MAIN_FILE"

          if [ -z "$MAIN_FILE" ]; then

            echo "ERROR: No @main Swift file found."

            exit 1

          fi

          BASENAME=$(basename "$MAIN_FILE")

          echo "Looking for $BASENAME in Xcode project..."

          if ! grep \
            -q \
            "$BASENAME" \
            Echo.xcodeproj/project.pbxproj; then

            echo "ERROR:"
            echo "$BASENAME is NOT included in Echo.xcodeproj"

            exit 1

          fi

          echo ""
          echo "SUCCESS:"
          echo "$BASENAME is included in Echo.xcodeproj"


      # =========================================================
      # PROJECT INFO
      # =========================================================

      - name: Show Xcode project
        run: |

          xcodebuild \
            -project Echo.xcodeproj \
            -list


      # =========================================================
      # RESOLVE YOUTUBEDL
      # =========================================================

      - name: Resolve YoutubeDL-iOS
        run: |

          xcodebuild \
            -resolvePackageDependencies \
            -project Echo.xcodeproj \
            -scheme Echo


      # =========================================================
      # CLEAN
      # =========================================================

      - name: Clean
        run: |

          xcodebuild \
            -project Echo.xcodeproj \
            -scheme Echo \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            ENABLE_PREVIEWS=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean


      # =========================================================
      # BUILD
      # =========================================================

      - name: Build Echo
        run: |

          set -o pipefail

          xcodebuild \
            -project Echo.xcodeproj \
            -scheme Echo \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            ENABLE_PREVIEWS=NO \
            CODE_SIGNING_ALLOWED=NO \
            build


      # =========================================================
      # RESULT
      # =========================================================

      - name: Show build result
        if: success()
        run: |

          echo "====================================="
          echo "       ECHO BUILD SUCCESSFUL"
          echo "====================================="

          echo ""

          find \
            ~/Library/Developer/Xcode/DerivedData \
            -type d \
            -name "Echo.app" \
            -print
