name: Echo YT-DLP Build Test

on:
  push:
    branches:
      - YT-DLP

  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Echo Xcode project
        run: |
          xcodegen generate --spec project.yml

      - name: Show generated project
        run: |
          ls -la
          xcodebuild \
            -project Echo.xcodeproj \
            -list

      - name: Resolve YoutubeDL-iOS
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project Echo.xcodeproj \
            -scheme Echo

      - name: Build Echo
        run: |
          set -o pipefail

          xcodebuild \
            -project Echo.xcodeproj \
            -scheme Echo \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
