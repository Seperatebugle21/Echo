name: Build Echo IPA (Unsigned)

on:
  workflow_dispatch:

  push:
    branches:
      - YT-DLP


jobs:
  build:

    runs-on: macos-latest

    permissions:
      contents: write


    steps:

      # ============================================
      # 1. Repository ophalen
      # ============================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================
      # 2. SwiftPM dependencies resolven
      # ============================================

      - name: Resolve SwiftPM dependencies
        run: |

          PACKAGE_DIR=$(find . -name "Package.swift" -exec dirname {} \; | head -n 1)

          echo "Gevonden Package map: $PACKAGE_DIR"

          if [ -z "$PACKAGE_DIR" ]; then
            echo "Geen Package.swift gevonden."
            exit 1
          fi

          cd "$PACKAGE_DIR"

          mkdir -p ../build

          echo ""
          echo "========================================"
          echo " RESOLVING PACKAGES"
          echo "========================================"
          echo ""

          xcodebuild \
            -resolvePackageDependencies \
            -scheme Echo \
            -derivedDataPath ../build/DerivedData


      # ============================================
      # 2B. Zoek specifiek libpython3
      # ============================================

      - name: Locate Python library
        run: |

          echo ""
          echo "========================================"
          echo " SEARCHING LIBPYTHON"
          echo "========================================"
          echo ""

          echo "Beschikbare libpython3.xcframework bestanden:"
          echo ""

          find build/DerivedData \
            -path "*libpython3.xcframework*" \
            -print || true


          echo ""
          echo "========================================"
          echo " SEARCHING IOS ARM64 PYTHON BINARY"
          echo "========================================"
          echo ""


          PYTHON_BIN=$(find build/DerivedData \
            -path "*libpython3.xcframework*" \
            -type f \
            -name "libpython3" \
            | grep "ios-arm64" \
            | head -n 1)


          # Fallback indien mapnaam anders is
          if [ -z "$PYTHON_BIN" ]; then

            echo "ios-arm64 slice niet rechtstreeks gevonden."
            echo "Fallback zoeken..."

            PYTHON_BIN=$(find build/DerivedData \
              -path "*libpython3.xcframework*" \
              -type f \
              -name "libpython3" \
              | head -n 1)
          fi


          echo ""
          echo "Python binary:"
          echo "$PYTHON_BIN"


          if [ -z "$PYTHON_BIN" ]; then

            echo ""
            echo "ERROR: libpython3 binary niet gevonden."
            echo ""

            exit 1
          fi


          if [ ! -f "$PYTHON_BIN" ]; then

            echo ""
            echo "ERROR: gevonden Python-pad is geen bestand."
            echo "$PYTHON_BIN"
            echo ""

            exit 1
          fi


          echo ""
          echo "Python binary gevonden."
          echo ""


          # Beschikbaar maken voor volgende GitHub Action steps

          echo "PYTHON_BIN=$PYTHON_BIN" >> "$GITHUB_ENV"


      # ============================================
      # 2C. Echo bouwen
      # ============================================

      - name: Build SwiftPM
        run: |

          PACKAGE_DIR=$(find . -name "Package.swift" -exec dirname {} \; | head -n 1)

          echo "Gevonden Package map: $PACKAGE_DIR"

          if [ -z "$PACKAGE_DIR" ]; then

            echo "Geen Package.swift gevonden."

            exit 1
          fi


          echo ""
          echo "========================================"
          echo " PYTHON BINARY"
          echo "========================================"
          echo ""

          echo "$PYTHON_BIN"


          if [ -z "$PYTHON_BIN" ]; then

            echo "ERROR: PYTHON_BIN environment variable ontbreekt."

            exit 1
          fi


          if [ ! -f "$PYTHON_BIN" ]; then

            echo "ERROR: libpython3 bestaat niet op:"
            echo "$PYTHON_BIN"

            exit 1
          fi


          cd "$PACKAGE_DIR"

          mkdir -p ../build


          echo ""
          echo "========================================"
          echo " BUILDING ECHO"
          echo "========================================"
          echo ""


          # ============================================
          # Belangrijk:
          #
          # GEEN -all_load
          #
          # -all_load forceert namelijk ook alle FFmpeg
          # objectfiles en veroorzaakt duplicate symbols.
          #
          # We forceren alleen libpython3 met -force_load.
          #
          # export_dynamic is nodig omdat PythonKit
          # CPython-symbolen opzoekt via:
          #
          # dlsym(RTLD_DEFAULT, ...)
          # ============================================

          xcodebuild archive \
            -scheme Echo \
            -destination 'generic/platform=iOS' \
            -archivePath ../build/Echo.xcarchive \
            -derivedDataPath ../build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            "OTHER_LDFLAGS=$(inherited) -Xlinker -export_dynamic -Xlinker -force_load -Xlinker $PYTHON_BIN" \
            DEAD_CODE_STRIPPING=NO \
            COPY_PHASE_STRIP=NO \
            STRIP_INSTALLED_PRODUCT=NO


      # ============================================
      # 2D. Controleer Python runtime
      # ============================================

      - name: Verify embedded Python runtime
        run: |

          echo ""
          echo "========================================"
          echo " CHECKING PYTHON RUNTIME"
          echo "========================================"
          echo ""


          APP_PATH=$(find build/Echo.xcarchive/Products/Applications \
            -maxdepth 1 \
            -name "*.app" \
            | head -n 1)


          # Fallback voor Swift Playgrounds output

          if [ -z "$APP_PATH" ]; then

            APP_PATH=$(find build/Echo.xcarchive/Products/Applications \
              -maxdepth 1 \
              -name "*.swiftpm" \
              | head -n 1)
          fi


          if [ -z "$APP_PATH" ]; then

            echo "ERROR: Echo.app niet gevonden."

            exit 1
          fi


          echo "App:"
          echo "$APP_PATH"


          # ============================================
          # Info.plist
          # ============================================

          INFO_PLIST="$APP_PATH/Info.plist"


          if [ ! -f "$INFO_PLIST" ]; then

            echo ""
            echo "ERROR: Info.plist niet gevonden:"
            echo "$INFO_PLIST"

            exit 1
          fi


          # ============================================
          # Executable zoeken
          # ============================================

          EXECUTABLE_NAME=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleExecutable" \
              "$INFO_PLIST"
          )


          EXECUTABLE="$APP_PATH/$EXECUTABLE_NAME"


          echo ""
          echo "Executable:"
          echo "$EXECUTABLE"


          if [ ! -f "$EXECUTABLE" ]; then

            echo ""
            echo "ERROR: executable niet gevonden."

            exit 1
          fi


          # ============================================
          # Resource bundles
          # ============================================

          echo ""
          echo "========================================"
          echo " RESOURCE BUNDLES"
          echo "========================================"
          echo ""


          find "$APP_PATH" \
            -type d \
            -name "*.bundle" \
            -print || true


          # ============================================
          # Python-gerelateerde bestanden
          # ============================================

          echo ""
          echo "========================================"
          echo " PYTHON-GERELATEERDE BESTANDEN"
          echo "========================================"
          echo ""


          find "$APP_PATH" \
            \( \
              -iname "*python*" \
              -o \
              -iname "*libssl*" \
              -o \
              -iname "*libcrypto*" \
              -o \
              -iname "*libffi*" \
            \) \
            -print || true


          # ============================================
          # Python standard library
          # ============================================

          echo ""
          echo "========================================"
          echo " PYTHON STDLIB"
          echo "========================================"
          echo ""


          find "$APP_PATH" \
            \( \
              -name "python310.zip" \
              -o \
              -path "*python3.10*" \
            \) \
            -print || true


          PYTHON_RESOURCE=$(find "$APP_PATH" \
            \( \
              -name "python310.zip" \
              -o \
              -path "*python3.10*" \
            \) \
            | head -n 1)


          if [ -z "$PYTHON_RESOURCE" ]; then

            echo ""
            echo "========================================"
            echo " ERROR"
            echo "========================================"
            echo ""

            echo "Python stdlib/resource bundle ontbreekt."
            echo ""

            exit 1
          fi


          echo ""
          echo "Python stdlib gevonden:"
          echo "$PYTHON_RESOURCE"


          # ============================================
          # CPython-symbolen controleren
          # ============================================

          echo ""
          echo "========================================"
          echo " CPYTHON SYMBOLS"
          echo "========================================"
          echo ""


          echo "--- Py_Initialize ---"

          xcrun nm -gU "$EXECUTABLE" \
            | grep "_Py_Initialize" \
            || true


          echo ""
          echo "--- Py_IsInitialized ---"

          xcrun nm -gU "$EXECUTABLE" \
            | grep "_Py_IsInitialized" \
            || true


          echo ""
          echo "--- PyUnicode_FromString ---"

          xcrun nm -gU "$EXECUTABLE" \
            | grep "_PyUnicode_FromString" \
            || true


          echo ""
          echo "--- PyObject_GetAttrString ---"

          xcrun nm -gU "$EXECUTABLE" \
            | grep "_PyObject_GetAttrString" \
            || true


          echo ""
          echo "--- Py_DecRef ---"

          xcrun nm -gU "$EXECUTABLE" \
            | grep "_Py_DecRef" \
            || true


          # ============================================
          # Strict symbol check
          # ============================================

          echo ""
          echo "========================================"
          echo " STRICT SYMBOL CHECK"
          echo "========================================"
          echo ""


          check_symbol() {

            SYMBOL="$1"

            if xcrun nm -gU "$EXECUTABLE" \
              | grep -q "$SYMBOL"; then

              echo "OK: $SYMBOL"

            else

              echo "MISSING: $SYMBOL"

              exit 1
            fi
          }


          check_symbol "_Py_Initialize"

          check_symbol "_Py_IsInitialized"

          check_symbol "_PyUnicode_FromString"

          check_symbol "_PyObject_GetAttrString"

          check_symbol "_Py_DecRef"


          echo ""
          echo "========================================"
          echo " PYTHON LINKING OK"
          echo "========================================"
          echo ""

          echo "Python stdlib:"
          echo "$PYTHON_RESOURCE"

          echo ""

          echo "Essentiële CPython-symbolen zijn aanwezig."


      # ============================================
      # 3. IPA maken + Info.plist aanpassen
      # ============================================

      - name: Create IPA Package
        run: |

          rm -rf Payload

          mkdir -p Payload


          # ============================================
          # Gebouwde app zoeken
          # ============================================

          BUILT_APP=$(find build/Echo.xcarchive/Products/Applications \
            -maxdepth 1 \
            -name "*.app" \
            | head -n 1)


          if [ -z "$BUILT_APP" ]; then

            BUILT_APP=$(find build/Echo.xcarchive/Products/Applications \
              -maxdepth 1 \
              -name "*.swiftpm" \
              | head -n 1)
          fi


          echo ""
          echo "Gebouwde app:"
          echo "$BUILT_APP"


          if [ -z "$BUILT_APP" ]; then

            echo "Geen gebouwde Echo app gevonden."

            exit 1
          fi


          # ============================================
          # Kopieer naar Payload
          # ============================================

          cp -R "$BUILT_APP" Payload/


          APP_PATH=$(find Payload \
            -maxdepth 1 \
            \( \
              -name "*.app" \
              -o \
              -name "*.swiftpm" \
            \) \
            | head -n 1)


          echo ""
          echo "App in Payload:"
          echo "$APP_PATH"


          if [ -z "$APP_PATH" ]; then

            echo "App niet gevonden in Payload."

            exit 1
          fi


          INFO_PLIST="$APP_PATH/Info.plist"


          if [ ! -f "$INFO_PLIST" ]; then

            echo "Info.plist niet gevonden:"
            echo "$INFO_PLIST"

            exit 1
          fi


          # ============================================
          # 3A. Background Audio
          # ============================================

          /usr/libexec/PlistBuddy \
            -c "Delete :UIBackgroundModes" \
            "$INFO_PLIST" \
            2>/dev/null || true


          /usr/libexec/PlistBuddy \
            -c "Add :UIBackgroundModes array" \
            "$INFO_PLIST"


          /usr/libexec/PlistBuddy \
            -c "Add :UIBackgroundModes:0 string audio" \
            "$INFO_PLIST"


          # ============================================
          # 3B. Files-app toegang
          # ============================================

          /usr/libexec/PlistBuddy \
            -c "Add :UIFileSharingEnabled bool true" \
            "$INFO_PLIST" \
            2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Set :UIFileSharingEnabled true" \
            "$INFO_PLIST"


          /usr/libexec/PlistBuddy \
            -c "Add :LSSupportsOpeningDocumentsInPlace bool true" \
            "$INFO_PLIST" \
            2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Set :LSSupportsOpeningDocumentsInPlace true" \
            "$INFO_PLIST"


          # ============================================
          # 3C. Spotify callback URL scheme
          #
          # echo-spotify-login://callback
          # ============================================

          /usr/libexec/PlistBuddy \
            -c "Delete :CFBundleURLTypes" \
            "$INFO_PLIST" \
            2>/dev/null || true


          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleURLTypes array" \
            "$INFO_PLIST"


          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleURLTypes:0 dict" \
            "$INFO_PLIST"


          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleURLTypes:0:CFBundleURLName string echo.spotify.login" \
            "$INFO_PLIST"


          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" \
            "$INFO_PLIST"


          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string echo-spotify-login" \
            "$INFO_PLIST"


          # ============================================
          # 3D. Debug Info.plist
          # ============================================

          echo ""
          echo "========================================"
          echo " FINAL INFO.PLIST"
          echo "========================================"
          echo ""


          /usr/libexec/PlistBuddy \
            -c "Print" \
            "$INFO_PLIST"


          echo ""
          echo "========================================"
          echo " URL TYPES"
          echo "========================================"
          echo ""


          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleURLTypes" \
            "$INFO_PLIST"


          # ============================================
          # Python controle in Payload
          # ============================================

          echo ""
          echo "========================================"
          echo " PYTHON FILES IN PAYLOAD"
          echo "========================================"
          echo ""


          find "$APP_PATH" \
            \( \
              -iname "*python*" \
              -o \
              -name "*.bundle" \
            \) \
            -print || true


          # ============================================
          # 3E. IPA maken
          # ============================================

          rm -f Echo.ipa

          zip -r Echo.ipa Payload


      # ============================================
      # 4. IPA uploaden
      # ============================================

      - name: Save IPA to Artifacts
        uses: actions/upload-artifact@v4

        with:
          name: Echo-Release-IPA
          path: Echo.ipa
