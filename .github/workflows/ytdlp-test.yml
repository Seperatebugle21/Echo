name: Test YoutubeDL-iOS

on:
  push:
    branches:
      - YT-DLP
  workflow_dispatch:

jobs:
  test-ytdlp:
    runs-on: macos-15

    steps:
      - name: Checkout Echo
        uses: actions/checkout@v4

      - name: Show repository
        run: |
          echo "Repository:"
          find . -maxdepth 3 -type f | sort

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Check Swift package
        run: |
          if [ ! -f "Echo.swiftpm/Package.swift" ]; then
            echo "Package.swift not found"
            exit 1
          fi

          echo "Found Echo.swiftpm/Package.swift"

      - name: Show Package.swift
        run: |
          cat Echo.swiftpm/Package.swift

      - name: Resolve packages
        working-directory: Echo.swiftpm
        run: |
          swift package resolve
