name: Build Echo IPA (Unsigned)

on:
  workflow_dispatch:

  push:
    branches:
      - YT-DLP


jobs:
  build:

    runs-on: macos-latest

    permissions:
      contents: write


    steps:

      # ============================================
      # 1. Repository ophalen
      # ============================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================
      # 2. SwiftPM dependencies resolven
      # ============================================

      - name: Resolve SwiftPM dependencies
        run: |

          PACKAGE_DIR=$(find . -name "Package.swift" -exec dirname {} \; | head -n 1)

          echo "Gevonden Package map: $PACKAGE_DIR"

          if [ -z "$PACKAGE_DIR" ]; then
            echo "Geen Package.swift gevonden."
            exit 1
          fi

          cd "$PACKAGE_DIR"

          mkdir -p ../build

          echo ""
          echo "========================================"
          echo " RESOLVING PACKAGES"
          echo "========================================"
          echo ""

          xcodebuild \
            -resolvePackageDependencies \
            -scheme Echo \
            -derivedDataPath ../build/DerivedData


      # ============================================
      # 2B. Zoek iOS arm64 libpython
      # ============================================

      - name: Locate Python library
        run: |

          echo ""
          echo "========================================"
          echo " SEARCHING LIBPYTHON"
          echo "========================================"
          echo ""

          PYTHON_XCFRAMEWORK=$(find build/DerivedData \
            -type d \
            -path "*libpython3.xcframework" \
            | head -n 1)

          if [ -z "$PYTHON_XCFRAMEWORK" ]; then
            echo "ERROR: libpython3.xcframework niet gevonden."
            exit 1
          fi

          PYTHON_XCFRAMEWORK=$(realpath "$PYTHON_XCFRAMEWORK")

          echo "XCFramework:"
          echo "$PYTHON_XCFRAMEWORK"

          echo ""
          echo "========================================"
          echo " SEARCHING DEVICE ARM64 SLICE"
          echo "========================================"
          echo ""

          PYTHON_BIN=$(find "$PYTHON_XCFRAMEWORK/ios-arm64" \
            -maxdepth 1 \
            -type f \
            -name "libpython*.a" \
            | head -n 1)

          if [ -z "$PYTHON_BIN" ]; then

            echo "ERROR: iOS arm64 libpython binary niet gevonden."

            echo ""
            echo "Inhoud ios-arm64:"
            echo ""

            find "$PYTHON_XCFRAMEWORK/ios-arm64" \
              -maxdepth 2 \
              -print || true

            exit 1
          fi

          PYTHON_BIN=$(realpath "$PYTHON_BIN")

          echo ""
          echo "Python device binary:"
          echo "$PYTHON_BIN"

          if [ ! -f "$PYTHON_BIN" ]; then
            echo "ERROR: gevonden Python binary bestaat niet."
            exit 1
          fi


          echo ""
          echo "========================================"
          echo " PYTHON BINARY INFO"
          echo "========================================"
          echo ""

          lipo -info "$PYTHON_BIN" || true


          echo ""
          echo "Py_Initialize in archive:"

          nm -g "$PYTHON_BIN" \
            | grep "_Py_Initialize" \
            | head -n 10 || true


          echo ""
          echo "Py_IsInitialized in archive:"

          nm -g "$PYTHON_BIN" \
            | grep "_Py_IsInitialized" \
            | head -n 10 || true


          echo ""
          echo "PyUnicode_FromString in archive:"

          nm -g "$PYTHON_BIN" \
            | grep "_PyUnicode_FromString" \
            | head -n 10 || true


          echo ""
          echo "========================================"
          echo " PYTHON DEVICE LIBRARY FOUND"
          echo "========================================"
          echo ""

          echo "$PYTHON_BIN"


          echo "PYTHON_BIN=$PYTHON_BIN" >> "$GITHUB_ENV"


      # ============================================
      # 2C. Echo bouwen
      # ============================================

      - name: Build SwiftPM
        run: |

          PACKAGE_DIR=$(find . -name "Package.swift" -exec dirname {} \; | head -n 1)

          echo "Gevonden Package map: $PACKAGE_DIR"

          if [ -z "$PACKAGE_DIR" ]; then
            echo "Geen Package.swift gevonden."
            exit 1
          fi


          echo ""
          echo "========================================"
          echo " PYTHON BINARY"
          echo "========================================"
          echo ""

          echo "$PYTHON_BIN"


          if [ -z "$PYTHON_BIN" ]; then
            echo "ERROR: PYTHON_BIN ontbreekt."
            exit 1
          fi


          if [ ! -f "$PYTHON_BIN" ]; then

            echo "ERROR: libpython3 bestaat niet op:"
            echo "$PYTHON_BIN"

            exit 1
          fi


          cd "$PACKAGE_DIR"

          mkdir -p ../build


          echo ""
          echo "========================================"
          echo " BUILDING ECHO"
          echo "========================================"
          echo ""


          xcodebuild archive \
            -scheme Echo \
            -destination 'generic/platform=iOS' \
            -archivePath ../build/Echo.xcarchive \
            -derivedDataPath ../build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            "OTHER_LDFLAGS=$(inherited) -Xlinker -export_dynamic -Xlinker -force_load -Xlinker $PYTHON_BIN" \
            DEAD_CODE_STRIPPING=NO \
            COPY_PHASE_STRIP=NO \
            STRIP_INSTALLED_PRODUCT=NO


      # ============================================
      # 2D. Controleer Python runtime
      # ============================================

      - name: Verify embedded Python runtime
        run: |

          echo ""
          echo "========================================"
          echo " CHECKING PYTHON RUNTIME"
          echo "========================================"
          echo ""


          APP_PATH=$(find build/Echo.xcarchive/Products/Applications \
            -maxdepth 1 \
            -name "*.app" \
            | head -n 1)


          if [ -z "$APP_PATH" ]; then

            APP_PATH=$(find build/Echo.xcarchive/Products/Applications \
              -maxdepth 1 \
              -name "*.swiftpm" \
              | head -n 1)
          fi


          if [ -z "$APP_PATH" ]; then

            echo "ERROR: Echo.app niet gevonden."

            exit 1
          fi


          APP_PATH=$(realpath "$APP_PATH")


          echo "App:"
          echo "$APP_PATH"


          INFO_PLIST="$APP_PATH/Info.plist"


          if [ ! -f "$INFO_PLIST" ]; then

            echo "ERROR: Info.plist niet gevonden:"
            echo "$INFO_PLIST"

            exit 1
          fi


          EXECUTABLE_NAME=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleExecutable" \
              "$INFO_PLIST"
          )


          EXECUTABLE="$APP_PATH/$EXECUTABLE_NAME"


          echo ""
          echo "Executable:"
          echo "$EXECUTABLE"


          if [ ! -f "$EXECUTABLE" ]; then

            echo "ERROR: executable niet gevonden."

            exit 1
          fi


          # ============================================
          # PythonSupport bundle
          # ============================================

          echo ""
          echo "========================================"
          echo " PYTHON SUPPORT BUNDLE"
          echo "========================================"
          echo ""


          PYTHON_SUPPORT_BUNDLE=$(find "$APP_PATH" \
            -type d \
            -name "*PythonSupport.bundle" \
            | head -n 1)


          echo "$PYTHON_SUPPORT_BUNDLE"


          if [ -z "$PYTHON_SUPPORT_BUNDLE" ]; then

            echo ""
            echo "ERROR: PythonSupport bundle ontbreekt."

            exit 1
          fi


          # ============================================
          # Python stdlib
          # ============================================

          echo ""
          echo "========================================"
          echo " PYTHON STDLIB"
          echo "========================================"
          echo ""


          find "$PYTHON_SUPPORT_BUNDLE" \
            \( \
              -name "python310.zip" \
              -o \
              -path "*python3.10*" \
            \) \
            -print || true


          PYTHON_RESOURCE=$(find "$PYTHON_SUPPORT_BUNDLE" \
            \( \
              -name "python310.zip" \
              -o \
              -path "*python3.10*" \
            \) \
            | head -n 1)


          if [ -z "$PYTHON_RESOURCE" ]; then

            echo ""
            echo "ERROR: Python stdlib/resource bundle ontbreekt."

            exit 1
          fi


          echo ""
          echo "Python stdlib gevonden:"
          echo "$PYTHON_RESOURCE"


          # ============================================
          # CPython-symbolen
          # ============================================

          echo ""
          echo "========================================"
          echo " CPYTHON SYMBOLS"
          echo "========================================"
          echo ""


          echo "--- Py_Initialize ---"

          xcrun nm -gU "$EXECUTABLE" \
            | grep "_Py_Initialize" \
            || true


          echo ""
          echo "--- Py_IsInitialized ---"

          xcrun nm -gU "$EXECUTABLE" \
            | grep "_Py_IsInitialized" \
            || true


          echo ""
          echo "--- PyUnicode_FromString ---"

          xcrun nm -gU "$EXECUTABLE" \
            | grep "_PyUnicode_FromString" \
            || true


          echo ""
          echo "--- PyObject_GetAttrString ---"

          xcrun nm -gU "$EXECUTABLE" \
            | grep "_PyObject_GetAttrString" \
            || true


          echo ""
          echo "--- Py_DecRef ---"

          xcrun nm -gU "$EXECUTABLE" \
            | grep "_Py_DecRef" \
            || true


          echo ""
          echo "========================================"
          echo " STRICT SYMBOL CHECK"
          echo "========================================"
          echo ""


          check_symbol() {

            SYMBOL="$1"

            if xcrun nm -gU "$EXECUTABLE" \
              | grep -q "$SYMBOL"; then

              echo "OK: $SYMBOL"

            else

              echo "MISSING: $SYMBOL"

              exit 1
            fi
          }


          check_symbol "_Py_Initialize"

          check_symbol "_Py_IsInitialized"

          check_symbol "_PyUnicode_FromString"

          check_symbol "_PyObject_GetAttrString"

          check_symbol "_Py_DecRef"


          echo ""
          echo "========================================"
          echo " PYTHON LINKING OK"
          echo "========================================"
          echo ""

          echo "PythonSupport:"
          echo "$PYTHON_SUPPORT_BUNDLE"

          echo ""

          echo "Python stdlib:"
          echo "$PYTHON_RESOURCE"


      # ============================================
      # 3. IPA maken
      # ============================================

      - name: Create IPA Package
        run: |

          rm -rf Payload

          mkdir -p Payload


          BUILT_APP=$(find build/Echo.xcarchive/Products/Applications \
            -maxdepth 1 \
            -name "*.app" \
            | head -n 1)


          if [ -z "$BUILT_APP" ]; then

            BUILT_APP=$(find build/Echo.xcarchive/Products/Applications \
              -maxdepth 1 \
              -name "*.swiftpm" \
              | head -n 1)
          fi


          echo ""
          echo "Gebouwde app:"
          echo "$BUILT_APP"


          if [ -z "$BUILT_APP" ]; then

            echo "Geen gebouwde Echo app gevonden."

            exit 1
          fi


          cp -R "$BUILT_APP" Payload/


          APP_PATH=$(find Payload \
            -maxdepth 1 \
            \( \
              -name "*.app" \
              -o \
              -name "*.swiftpm" \
            \) \
            | head -n 1)


          echo ""
          echo "App in Payload:"
          echo "$APP_PATH"


          if [ -z "$APP_PATH" ]; then

            echo "App niet gevonden in Payload."

            exit 1
          fi


          INFO_PLIST="$APP_PATH/Info.plist"


          if [ ! -f "$INFO_PLIST" ]; then

            echo "Info.plist niet gevonden:"
            echo "$INFO_PLIST"

            exit 1
          fi


          # ============================================
          # Background Audio
          # ============================================

          /usr/libexec/PlistBuddy \
            -c "Delete :UIBackgroundModes" \
            "$INFO_PLIST" \
            2>/dev/null || true


          /usr/libexec/PlistBuddy \
            -c "Add :UIBackgroundModes array" \
            "$INFO_PLIST"


          /usr/libexec/PlistBuddy \
            -c "Add :UIBackgroundModes:0 string audio" \
            "$INFO_PLIST"


          # ============================================
          # Files app
          # ============================================

          /usr/libexec/PlistBuddy \
            -c "Add :UIFileSharingEnabled bool true" \
            "$INFO_PLIST" \
            2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Set :UIFileSharingEnabled true" \
            "$INFO_PLIST"


          /usr/libexec/PlistBuddy \
            -c "Add :LSSupportsOpeningDocumentsInPlace bool true" \
            "$INFO_PLIST" \
            2>/dev/null || \
          /usr/libexec/PlistBuddy \
            -c "Set :LSSupportsOpeningDocumentsInPlace true" \
            "$INFO_PLIST"


          # ============================================
          # Spotify callback
          # ============================================

          /usr/libexec/PlistBuddy \
            -c "Delete :CFBundleURLTypes" \
            "$INFO_PLIST" \
            2>/dev/null || true


          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleURLTypes array" \
            "$INFO_PLIST"


          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleURLTypes:0 dict" \
            "$INFO_PLIST"


          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleURLTypes:0:CFBundleURLName string echo.spotify.login" \
            "$INFO_PLIST"


          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" \
            "$INFO_PLIST"


          /usr/libexec/PlistBuddy \
            -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string echo-spotify-login" \
            "$INFO_PLIST"


          echo ""
          echo "========================================"
          echo " FINAL INFO.PLIST"
          echo "========================================"
          echo ""


          /usr/libexec/PlistBuddy \
            -c "Print" \
            "$INFO_PLIST"


          echo ""
          echo "========================================"
          echo " PYTHON FILES IN PAYLOAD"
          echo "========================================"
          echo ""


          find "$APP_PATH" \
            \( \
              -iname "*python*" \
              -o \
              -name "*.bundle" \
            \) \
            -print || true


          rm -f Echo.ipa

          zip -r Echo.ipa Payload


      # ============================================
      # 4. IPA uploaden
      # ============================================

      - name: Save IPA to Artifacts
        uses: actions/upload-artifact@v4

        with:
          name: Echo-Release-IPA
          path: Echo.ipa
