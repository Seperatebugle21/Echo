name: Echo

options:
  bundleIdPrefix: com.echomusic
  createIntermediateGroups: true

packages:
  YoutubeDLIOS:
    url: https://github.com/kewlbear/YoutubeDL-iOS.git
    from: 0.0.2

targets:

  Echo:
    type: application
    platform: iOS

    # Tijdelijk 18.0 zodat we eerst met de aanwezige SDK
    # kunnen bewijzen dat de Xcode build werkt.
    deploymentTarget: "18.0"

    sources:
      - path: Echo.swiftpm/Echo
        type: group

    settings:
      base:

        PRODUCT_BUNDLE_IDENTIFIER: com.echomusic.app
        PRODUCT_NAME: Echo

        SWIFT_VERSION: "5.0"

        IPHONEOS_DEPLOYMENT_TARGET: "18.0"

        TARGETED_DEVICE_FAMILY: "1,2"

        GENERATE_INFOPLIST_FILE: YES

        ENABLE_PREVIEWS: NO

        DEBUG_INFORMATION_FORMAT: dwarf

        INFOPLIST_KEY_UIMediaLibraryUsageDescription: "Used to add music from local files or Apple Music to Echo"

        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Used to connect to external devices like headphones or speakers"

    dependencies:

      - package: YoutubeDLIOS
        product: YoutubeDL

    scheme:
      gatherCoverageData: false
