name: Echo

options:
  minimumXcodeGenVersion: 2.45.4
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"

packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: 2.6.0
  YoutubeDL:
    url: https://github.com/Seperatebugle21/YoutubeDL-iOS.git
    branch: main
  PythonKit:
    url: https://github.com/pvieito/PythonKit.git
    exactVersion: 0.5.1
  Python-iOS:
    url: https://github.com/kewlbear/Python-iOS.git
    exactVersion: 0.1.1-b20230423-090254
  EchoNativeAudio:
    path: Packages/EchoNativeAudio

targets:
  Echo:
    type: application
    platform: iOS
    sources:
      - path: Echo.swiftpm/Echo
      - path: Echo.swiftpm/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.echomusic.app
        PRODUCT_NAME: Echo
        INFOPLIST_FILE: Echo.swiftpm/Info.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/Echo.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SUPPORTS_MACCATALYST: NO
      configs:
        Release:
          OTHER_LDFLAGS: "$(inherited) -Xlinker -export_dynamic -Xlinker -force_load -Xlinker $(ECHO_PYTHON_BIN)"
    dependencies:
      - package: SwiftSoup
      - package: YoutubeDL
      - package: PythonKit
      - package: Python-iOS
      - package: EchoNativeAudio
        product: CLame
      - target: EchoWidget
        embed: true

  EchoWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: EchoWidget
      - path: Echo.swiftpm/Echo/Widgets/EchoWidgetModels.swift
      - path: Echo.swiftpm/Echo/Widgets/EchoWidgetIntents.swift
      - path: Echo.swiftpm/Echo/Localizable.xcstrings
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.echomusic.app.widget
        PRODUCT_NAME: EchoWidget
        INFOPLIST_FILE: Configuration/EchoWidget-Info.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/EchoWidget.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ECHO_WIDGET_EXTENSION"
        SKIP_INSTALL: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  EchoArtistTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/ArtistCreditsTests.swift
      - path: Echo.swiftpm/Echo/Models/ArtistCredits.swift
      - path: Echo.swiftpm/Echo/Models/Song.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.echomusic.app.artist-tests
        GENERATE_INFOPLIST_FILE: YES

  EchoLyricsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/EchoLyricsTests.swift
      - path: Echo.swiftpm/Echo/Managers/LyricsManager.swift
      - path: Echo.swiftpm/Echo/Managers/LyricsSupport.swift
      - path: Echo.swiftpm/Echo/Managers/GeniusLyricsParser.swift
      - path: Echo.swiftpm/Echo/Models/Song.swift
    dependencies:
      - package: SwiftSoup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.echomusic.app.lyrics-tests
        GENERATE_INFOPLIST_FILE: YES

  EchoWidgetModelTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/EchoWidgetModelTests.swift
      - path: Echo.swiftpm/Echo/Widgets/EchoWidgetModels.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.echomusic.app.widget-model-tests
        GENERATE_INFOPLIST_FILE: YES

  EchoPodcastTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/EchoPodcastTests.swift
      - path: Tests/HomeDiscoverySelectionTests.swift
      - path: Echo.swiftpm/Echo/Models/HomeDiscoverySelection.swift
      - path: Echo.swiftpm/Echo/Podcasts/PodcastModels.swift
      - path: Echo.swiftpm/Echo/Podcasts/PodcastCatalog.swift
      - path: Echo.swiftpm/Echo/Podcasts/PodcastTranscript.swift
      - path: Echo.swiftpm/Echo/Views/TabBarSettingsView.swift
      - path: Echo.swiftpm/Echo/Views/EchoAppearance.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.echomusic.app.podcast-tests
        GENERATE_INFOPLIST_FILE: YES

  EchoFeatureTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/EchoCatalogTests.swift
      - path: Echo.swiftpm/Echo/Models/OnlineMusicCatalog.swift
      - path: Echo.swiftpm/Echo/Models/SpotifyCatalogJSON.swift
      - path: Echo.swiftpm/Echo/Models/LibraryAlbums.swift
      - path: Echo.swiftpm/Echo/Spotify/SpotifyURLParser.swift
      - path: Echo.swiftpm/Echo/YoutubeMusic/YouTubeMusicMetadata.swift
      - path: Tests/EchoFeatureLogicTests.swift
      - path: Tests/EchoReleaseDetectionTests.swift
      - path: Tests/EchoAudioEngineTests.swift
      - path: Tests/EchoThemeTests.swift
      - path: Tests/EchoPlaybackInteractionTests.swift
      - path: Tests/EchoSmartPlaylistOverrideTests.swift
      - path: Echo.swiftpm/Echo/Models/Song.swift
      - path: Echo.swiftpm/Echo/Models/PlaylistCoverGeometry.swift
      - path: Echo.swiftpm/Echo/Models/EchoLocalization.swift
      - path: Echo.swiftpm/Echo/Models/Playlist.swift
      - path: Echo.swiftpm/Echo/Models/SmartPlaylist.swift
      - path: Echo.swiftpm/Echo/Models/PlaybackInteraction.swift
      - path: Echo.swiftpm/Echo/Models/SongMetadataUpdates.swift
      - path: Echo.swiftpm/Echo/Managers/SongLibraryPersistence.swift
      - path: Echo.swiftpm/Echo/Managers/AudioTransition.swift
      - path: Echo.swiftpm/Echo/Managers/AudioSettings.swift
      - path: Echo.swiftpm/Echo/Managers/EqualizerSettings.swift
      - path: Echo.swiftpm/Echo/Managers/EqualizedAudioPlayer.swift
      - path: Echo.swiftpm/Echo/Podcasts/PodcastModels.swift
      - path: Echo.swiftpm/Echo/Podcasts/PodcastReleaseDetection.swift
      - path: Echo.swiftpm/Echo/Views/EchoAppearance.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.echomusic.app.feature-tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  EchoFeatureTests:
    build:
      targets:
        EchoFeatureTests: all
    test:
      targets:
        - EchoFeatureTests
  EchoPodcastTests:
    build:
      targets:
        EchoPodcastTests: all
    test:
      targets:
        - EchoPodcastTests
  EchoArtistTests:
    build:
      targets:
        EchoArtistTests: all
    test:
      targets:
        - EchoArtistTests
  EchoLyricsTests:
    build:
      targets:
        EchoLyricsTests: all
    test:
      targets:
        - EchoLyricsTests
  Echo:
    build:
      targets:
        Echo: all
        EchoWidget: all
    run:
      config: Debug
    archive:
      config: Release
  EchoWidgetModelTests:
    build:
      targets:
        EchoWidgetModelTests: all
    test:
      targets:
        - EchoWidgetModelTests
